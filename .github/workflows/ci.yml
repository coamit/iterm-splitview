name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install ShellCheck
        run: brew install shellcheck

      - name: Lint (ShellCheck + ESLint)
        run: make lint

      - name: JS Unit Tests
        run: make test-js

      - name: CLI Integration Tests
        env:
          CI: true
        run: make test-cli
