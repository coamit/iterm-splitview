<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; }

.fv-tab {

/* Group selector bar */

.fv-tab-ts { display: none; }
.fv-tab-content { display: none; padding: 14px 18px; }

.code-lines { display: table; width: 100%; border-collapse: collapse; margin: 8px 0; }

/* Diff navigation arrows */

.diff-collapsed .code-line { display: none; }

.diff-collapsed .code-line.diff-removed,

.diff-collapsed .code-line.diff-spacer .ln,
.diff-collapsed .code-line.diff-spacer .lc { background: transparent; padding: 6px 0; border: none; height: 0; }
.diff-collapsed pre { overflow-x: hidden; }

.diff-counter-badge { position: fixed; bottom: 16px; left: 16px; background: #2a3040; border: 1px solid #353b4a; border-radius: 6px; padding: 4px 12px; font-size: 12px; font-family: "JetBrains Mono", monospace; color: #ccd0d4; z-index: 200; display: none; user-select: none; }

    <div class="fv-settings-sidebar">
      <div class="fv-settings-sidebar-title">Settings</div>

      <div class="fv-settings-nav-item" data-section="git">Git</div>
      <div class="fv-settings-nav-item" data-section="shortcuts">Shortcuts</div>
    </div>

        <span id="fv-settings-section-title">Appearance</span>
        <div class="fv-settings-close" id="fv-settings-close">&times;</div>
      </div>
      <!-- Appearance -->
      <div class="fv-settings-pane active" id="fv-settings-pane-appearance">
        <div class="fv-settings-section">Theme</div>
        <div class="fv-theme-grid" id="fv-theme-grid"></div>
      </div>
      <!-- Git -->
      <div class="fv-settings-pane" id="fv-settings-pane-git">
        <div class="fv-settings-section">Diff View</div>
        <div style="display:flex;gap:8px;margin-bottom:18px">
          <div class="fv-theme-card" id="fv-git-mode-branch" style="flex:1;cursor:pointer">
            <div style="padding:10px 12px;font-size:12px;font-family:-apple-system,sans-serif">
              <div style="font-weight:600;margin-bottom:4px">Branch changes</div>
              <div style="color:#6a7080;font-size:11px">All changes since branching from main (PR view)</div>

            <div style="padding:10px 12px;font-size:12px;font-family:-apple-system,sans-serif">
              <div style="font-weight:600;margin-bottom:4px">Local changes</div>
              <div style="color:#6a7080;font-size:11px">Only uncommitted and staged changes</div>
            </div>
          </div>
        </div>
        <div style="margin-top:4px;font-size:11px;color:#6a7080;font-family:-apple-system,sans-serif">Use <span style="color:#ccd0d4">Ctrl+I</span> to watch a new repository.</div>
      </div>
      <!-- Shortcuts -->
      <div class="fv-settings-pane" id="fv-settings-pane-shortcuts"></div>
    </div>
  </div>
</div>
<div class="fv-settings-overlay" id="fv-git-watch-overlay">
  <div class="fv-settings" style="width:560px;max-height:160px;position:relative">

      <div style="font-size:12px;font-weight:600;color:#e8ecf0;font-family:-apple-system,sans-serif;margin-bottom:12px">Watch Repository</div>

  function pollGroupCount(groupName, repoName) {

      fetch('/_git-settings')

  function addGroupHeader(groupName, label) {
    var groupBar = document.querySelector('.fv-group-bar');
    if (!groupBar) return;
    // Don't add if already exists
    if (groupBar.querySelector('[data-group="' + groupName + '"]')) return;
    // Insert before the ⎇ watch button so new groups are always to its left
    var addGitBtn = document.getElementById('fv-add-git');
    var insertBefore = addGitBtn || groupBar.querySelector('.fv-tab-spacer');
    var sel = document.createElement('span');
    sel.className = 'fv-group-sel';

    groupBar.insertBefore(sel, insertBefore);
    // Add click handler — if no tabs loaded yet, trigger fresh regen and show loader
    sel.addEventListener('click', function(e) {
      if (e.target.classList.contains('fv-group-close')) return;
      var tabs = document.querySelectorAll('.fv-tab[data-group="' + groupName + '"]');
      if (tabs.length === 0) {

        switchGroup(groupName);

      fetch('/_git-settings?watch=' + encodeURIComponent(path))
        .then(function(r) { return r.json(); })
        .then(function(data) {
          if (data.error) {
            if (gitWatchStatus) gitWatchStatus.textContent = data.error;
          } else if (data.already_watching) {
            if (gitWatchStatus) gitWatchStatus.textContent = 'Already watching ' + data.already_watching;
          } else if (data.added) {
            if (gitWatchStatus) gitWatchStatus.textContent = '';
            gitWatchInput.value = '';
            closeGitWatch();
            var groupName = 'git.' + data.added;
            // 1. Add group header to group bar
            addGroupHeader(groupName, data.added);
            // 2. Create loading panel BEFORE switchGroup so it shows the spinner
            var loadPanelId = 'fv-loading-' + groupName.replace(/\./g, '-');
            var loadPanel = document.createElement('div');
            loadPanel.className = 'fv-tab-content';
            loadPanel.id = loadPanelId;
            loadPanel.setAttribute('data-loading-group', groupName);
            loadPanel.innerHTML = '<div class="fv-tab-loading-content">Loading ' + escHtml(data.added) + ' changes\u2026</div>';
            document.body.appendChild(loadPanel);

            switchGroup(groupName);

  // Tab switching
  function activateTab(tabId) {
    document.querySelectorAll('.fv-tab').forEach(function(t) { t.classList.remove('active'); });
    document.querySelectorAll('.fv-tab-content').forEach(function(c) { c.classList.remove('active'); });
    var tab = document.querySelector('[data-tab="' + tabId + '"]');
    if (tab) {

      if (content) content.classList.add('active');

  // --- Reusable listener attachment for body content ---
  function attachBodyListeners(root) {
    root.querySelectorAll('.fv-tab').forEach(function(tab) {
      tab.addEventListener('click', function(e) {
        if (e.target.classList.contains('fv-tab-close')) return;
        activateTab(tab.getAttribute('data-tab'));
        history.replaceState(null, '', '#' + tab.getAttribute('data-tab'));
      });
    });
    root.querySelectorAll('.fv-tab-close').forEach(function(btn) {
      btn.addEventListener('click', function(e) {
        e.stopPropagation();
        var filePath = btn.getAttribute('data-close-path');
        var tab = btn.closest('.fv-tab');
        var tabId = tab.getAttribute('data-tab');
        var content = document.getElementById(tabId);
        var wasActive = tab.classList.contains('active');
        var closedGroup = tab.getAttribute('data-group');
        var groupTabs = Array.from(document.querySelectorAll('.fv-tab[data-group="' + closedGroup + '"][data-tab]'));
        var idx = groupTabs.indexOf(tab);
        var nextTab = idx < groupTabs.length - 1 ? groupTabs[idx + 1] : null;
        var prevTab = idx > 0 ? groupTabs[idx - 1] : null;
        var newActiveTarget = wasActive ? (nextTab || prevTab) : document.querySelector('.fv-tab.active');
        var newActivePath = newActiveTarget ? (newActiveTarget.getAttribute('title') || '') : '';
        tab.remove();
        if (content) content.remove();
        updateGroupCounts();
        if (wasActive && newActiveTarget) {
          activateTab(newActiveTarget.getAttribute('data-tab'));
          history.replaceState(null, '', '#' + newActiveTarget.getAttribute('data-tab'));
        }
        var remainingInGroup = document.querySelectorAll('.fv-tab[data-group="' + closedGroup + '"][data-tab]');
        if (wasActive && remainingInGroup.length === 0) {
          document.querySelectorAll('.fv-tab-content.active').forEach(function(c) { c.classList.remove('active'); });
          switchGroup(closedGroup);
        }
        pendingCloses++;
        fetch('/_close?path=' + encodeURIComponent(filePath) + '&active=' + encodeURIComponent(newActivePath))
          .finally(function() { pendingCloses--; lastCloseCompleted = Date.now(); });
      });
    });
    root.querySelectorAll('.fv-group-sel').forEach(function(sel) {
      sel.addEventListener('click', function(e) {
        if (e.target.classList.contains('fv-group-close')) return;
        var group = sel.getAttribute('data-group');
        switchGroup(group);
        var visibleActive = document.querySelector('.fv-tab.fv-group-visible.active');
        if (!visibleActive) {
          var first = document.querySelector('.fv-tab.fv-group-visible[data-tab]');
          if (first) {
            activateTab(first.getAttribute('data-tab'));
            history.replaceState(null, '', '#' + first.getAttribute('data-tab'));
          }
        }
      });
    });
    root.querySelectorAll('.fv-group-close').forEach(function(btn) {

  attachBodyListeners(document.getElementById('fv-body-container'));
  // Restore active tab from URL hash (survives auto-reload)
  var hash = window.location.hash.substring(1);
  if (hash && hash.indexOf('fv-group:') === 0) {

    var targetGroup = hash.substring('fv-group:'.length);

    var targetPath = decodeURIComponent(hash.substring('fv-path:'.length));

  // --- Reusable initialization: hljs + line numbers + diff attrs + mermaid prep ---
  function initializeContent(root) {
    root.querySelectorAll('pre code').forEach(function(block) {
      if (block.closest('pre.mermaid') || block.classList.contains('mermaid')) return;
      var plainText = block.textContent;
      var lang = (block.className.match(/language-(\S+)/) || block.className.match(/sourceCode\s+(\S+)/) || [])[1] || '';
      var highlighted = lang && hljs.getLanguage(lang)
        ? hljs.highlight(plainText, { language: lang }).value
        : plainText.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      var lines = highlighted.split('\n');
      if (lines[lines.length - 1] === '') lines.pop();
      var html = lines.map(function(line, i) {
        return '<div class="code-line"><span class="ln" data-ln="' + (i + 1) + '"></span><span class="lc">' + (line || '\u00a0') + '</span></div>';
      }).join('');
      var wrapper = document.createElement('div');
      wrapper.className = 'code-lines';
      wrapper.innerHTML = html;
      var diffAdded = block.getAttribute('data-diff-added');
      var diffRemoved = block.getAttribute('data-diff-removed');
      if (diffAdded) {
        var addedSet = new Set(diffAdded.split(',').map(Number));
        wrapper.querySelectorAll('.code-line').forEach(function(line, i) {
          if (addedSet.has(i + 1)) line.classList.add('diff-added');
        });
      }
      if (diffRemoved) {
        try {
          var removedMap = JSON.parse(diffRemoved);
          var codeLines = wrapper.querySelectorAll('.code-line');
          var insertions = [];
          Object.keys(removedMap).forEach(function(afterLine) {
            var removedLines = removedMap[afterLine];
            var targetIdx = parseInt(afterLine, 10);
            var targetEl = codeLines[targetIdx] || null;
            removedLines.forEach(function(text) {
              var row = document.createElement('div');
              row.className = 'code-line diff-removed';
              row.innerHTML = '<span class="ln"></span><span class="lc">' + text + '</span>';
              insertions.push({ before: targetEl, el: row });
            });
          });
          insertions.reverse().forEach(function(ins) {
            if (ins.before) wrapper.insertBefore(ins.el, ins.before);
            else wrapper.appendChild(ins.el);
          });
        } catch(e) {}
      }
      block.innerHTML = '';
      block.style.padding = '0';
      block.style.background = 'none';
      block.parentElement.style.padding = '0';
      block.appendChild(wrapper);
    });
    root.querySelectorAll('pre.mermaid').forEach(function(pre) {
      var div = document.createElement('div');
      div.className = 'mermaid';
      div.textContent = pre.textContent;
      pre.replaceWith(div);
    });
  }

  loadingToast.innerHTML = '<div style="width:14px;height:14px;border:2px solid #353b4a;border-top-color:#73b8f0;border-radius:50%;animation:fvspin 0.8s linear infinite"></div><span style="font-size:12px;color:#6a7080;font-family:-apple-system,sans-serif">Loading...</span>';
  var fvStyle = document.createElement('style');

  // --- Polling infrastructure ---
  // Each poller: { id, xhr } — id is the setInterval handle, xhr is the in-flight request
  var pollers = { loading: { id: null, xhr: null }, reload: { id: null, xhr: null }, timestamp: { id: null, xhr: null } };

  function abortPoller(name) {
    var p = pollers[name];
    if (p.xhr) { p.xhr.abort(); p.xhr = null; }
  }

  function stopPoller(name) {
    var p = pollers[name];
    if (p.id) { clearInterval(p.id); p.id = null; }
    abortPoller(name);
  }

  function stopAllPollers() {
    stopPoller('loading');
    stopPoller('reload');
    stopPoller('timestamp');
  }

  // --- Loading toast poller (stops itself once loading is done) ---
  function pollLoading() {
    abortPoller('loading');
    try {
      var xhr = new XMLHttpRequest();
      pollers.loading.xhr = xhr;
      xhr.open('GET', '/_loading?t=' + Date.now(), true);
      xhr.onload = function() {
        pollers.loading.xhr = null;
        try {
          var d = JSON.parse(xhr.responseText);
          var showIt = d.loading && lastOpenTriggered === 0 && (Date.now() - pageLoadTime) > 2000;
          loadingToast.style.display = showIt ? 'flex' : 'none';
          if (!d.loading) stopPoller('loading');
        } catch(e) {}
      };
      xhr.send();
    } catch(e) {}
  }

  function startLoadingPoll() {
    if (pollers.loading.id) return;
    pollers.loading.id = setInterval(pollLoading, 300);
  }

  // --- In-place content swap (replaces location.reload) ---
  var marker = document.querySelector('[data-fv-gen]');
  var genTime = marker ? marker.getAttribute('data-fv-gen') : null;
  var tabCount = marker ? parseInt(marker.getAttribute('data-fv-tabs') || '0', 10) : 0;
  var swapInProgress = false;
  var lastOpenedFilePath = ''; // Tracks the most recent file opened via Ctrl+O

  function performSwap(newBodyHtml) {
    if (swapInProgress) return;
    swapInProgress = true;

    // 1. Save state
    var scrollTop = window.scrollY;
    var activeTab = document.querySelector('.fv-tab.active');
    // Only use lastOpenedFilePath if user is still on a loading tab;
    // if they navigated away to a real tab, respect their choice
    var isOnLoadingTab = activeTab && activeTab.classList.contains('loading');
    var activeTabPath = (isOnLoadingTab && lastOpenedFilePath)
      ? lastOpenedFilePath
      : (activeTab ? activeTab.getAttribute('title') : '');
    lastOpenedFilePath = '';
    var activeGroupSel = document.querySelector('.fv-group-sel.active');
    var activeGroup = activeGroupSel ? activeGroupSel.getAttribute('data-group') : 'files';
    // Detect if user was on a loading group (spinner visible)
    // Note: activeTab may still be set (hidden tab from another group), so don't check !activeTab
    var wasOnLoadingGroup = activeGroupSel && loadingGroups[activeGroup];

    // 2. Prepare offscreen — init hljs, diff attrs, mermaid prep
    var offscreen = document.createElement('div');
    offscreen.innerHTML = newBodyHtml;
    initializeContent(offscreen);
    initDiffCollapseOn(offscreen);

    // 3. Swap into live DOM
    var container = document.getElementById('fv-body-container');
    container.innerHTML = offscreen.innerHTML;

    // 4. Attach event listeners to new content
    attachBodyListeners(container);

    // 4b. Clear resolved loading groups BEFORE tab restore
    // (switchGroup checks loadingGroups and early-returns with loading panel if set)
    updateGroupCounts();
    Object.keys(loadingGroups).forEach(function(gn) {
      if (document.querySelectorAll('.fv-tab[data-group="' + gn + '"][data-tab]').length > 0) {
        var lp = document.getElementById(loadingGroups[gn]);
        if (lp) lp.remove();
        delete loadingGroups[gn];
      }
    });

    // 5. Restore active tab
    if (wasOnLoadingGroup) {
      // Was on a loading group (spinner) — switch to that group's first real tab
      switchGroup(activeGroup);
      var first = document.querySelector('.fv-tab.fv-group-visible[data-tab]');
      if (first) activateTab(first.getAttribute('data-tab'));
    } else if (activeTabPath) {
      var restoredTab = container.querySelector('.fv-tab[title="' + activeTabPath.replace(/"/g, '\\"') + '"]');
      if (restoredTab) {
        var restoredGroup = restoredTab.getAttribute('data-group');
        if (restoredGroup && container.querySelector('.fv-group-bar')) {
          switchGroup(restoredGroup);
        }
        activateTab(restoredTab.getAttribute('data-tab'));
      } else {
        // Tab was removed — stay in same group, activate first tab
        switchGroup(activeGroup);
        var first = document.querySelector('.fv-tab.fv-group-visible[data-tab]');
        if (first) activateTab(first.getAttribute('data-tab'));
      }
    } else {
      // No active tab before — activate first in default group
      var groupBar = container.querySelector('.fv-group-bar');
      if (groupBar) {
        var defGroup = container.querySelector('.fv-group-sel.active');
        if (defGroup) switchGroup(defGroup.getAttribute('data-group'));
      }
      var first = document.querySelector('.fv-tab.fv-group-visible[data-tab]') || document.querySelector('.fv-tab[data-tab]');
      if (first) activateTab(first.getAttribute('data-tab'));
    }

    // 6. Mermaid rendering (needs live DOM)
    var mermaidEls = container.querySelectorAll('.mermaid:not([data-processed])');
    if (mermaidEls.length > 0) {
      try { mermaid.run({ nodes: mermaidEls }); } catch(e) {}
    }

    // 7. Restore scroll + ensure content visible
    window.scrollTo(0, scrollTop);
    var newActive = document.querySelector('.fv-tab-content.active');
    if (newActive) newActive.classList.add('fv-reveal');

    // 8. Update metadata from new content
    var newMarker = container.querySelector('[data-fv-gen]');
    if (newMarker) {
      genTime = newMarker.getAttribute('data-fv-gen');
      tabCount = parseInt(newMarker.getAttribute('data-fv-tabs') || '0', 10);
      var newEpoch = parseInt(newMarker.getAttribute('data-fv-time') || '0', 10);
      if (newEpoch) tsGenEpoch = newEpoch;
    }

    // 9. Hide loading indicators
    loadingToast.style.display = 'none';
    swapInProgress = false;
  }

  // --- Auto-reload poller (lightweight /_gen endpoint) ---
  function pollReload() {
    abortPoller('reload');
    if (swapInProgress) return;
    try {
      var xhr = new XMLHttpRequest();
      pollers.reload.xhr = xhr;
      xhr.open('GET', '/_gen?t=' + Date.now(), true);
      xhr.onload = function() {
        pollers.reload.xhr = null;
        try {
          var d = JSON.parse(xhr.responseText);
          if (d.gen && d.gen !== genTime) {
            var closeGuard = pendingCloses > 0 || (Date.now() - lastCloseCompleted) < 5000;
            if (closeGuard || (Date.now() - pageLoadTime) < 2000) {
              if (closeGuard) genTime = d.gen;
              return;
            }
            if (lastOpenTriggered > 0) {
              if ((Date.now() - lastOpenTriggered) < 5000) return;
              try {
                var lxhr = new XMLHttpRequest();
                lxhr.open('GET', '/_loading', false);
                lxhr.send();
                var ld = JSON.parse(lxhr.responseText);
                if (ld.loading) return;
              } catch(e) {}
              lastOpenTriggered = 0;
            }
            // Fetch new content and swap in-place (no page reload)
            if (swapInProgress) return;
            var fetchXhr = new XMLHttpRequest();
            fetchXhr.open('GET', '/index.html?t=' + Date.now(), true);
            fetchXhr.onload = function() {
              if (fetchXhr.status !== 200) return;
              var parser = new DOMParser();
              var doc = parser.parseFromString(fetchXhr.responseText, 'text/html');
              var newContainer = doc.getElementById('fv-body-container');
              if (newContainer) {
                performSwap(newContainer.innerHTML);
              }
            };
            fetchXhr.send();
          }
        } catch(e) {}
      };
      xhr.send();
    } catch(e) {}
  }

  function startReloadPoll() {
    if (!marker || pollers.reload.id) return;
    pollers.reload.id = setInterval(pollReload, 1500);
  }

  // --- Timestamp poller ---
  var tsEl = document.getElementById('fv-ts');
  var timeMarker = document.querySelector('[data-fv-time]');
  var tsGenEpoch = timeMarker ? parseInt(timeMarker.getAttribute('data-fv-time'), 10) : 0;

  function updateTimestamp() {
    if (!tsEl) return;
    var diff = Math.floor(Date.now() / 1000) - tsGenEpoch;
    var text;
    if (diff < 60) text = diff + 's ago';
    else if (diff < 3600) text = Math.floor(diff / 60) + 'm ago';
    else if (diff < 86400) text = Math.floor(diff / 3600) + 'h ago';
    else text = Math.floor(diff / 86400) + 'd ago';
    tsEl.textContent = 'Updated ' + text;
  }

  function startTimestampPoll() {
    if (!tsEl || pollers.timestamp.id) return;
    updateTimestamp();
    pollers.timestamp.id = setInterval(updateTimestamp, 1000);
  }

  // --- Start all pollers ---
  startLoadingPoll();
  startReloadPoll();
  startTimestampPoll();

  // Pause when page is hidden, resume when visible
  document.addEventListener('visibilitychange', function() {
    if (document.hidden) {
      stopAllPollers();
    } else {
      startLoadingPoll();
      startReloadPoll();
      startTimestampPoll();
    }
  });

  // Diff navigation — jump between changes with Ctrl+D
  var currentDiffIdx = -1;
  var diffCounterBadge = document.getElementById('diff-counter-badge');
  var DIFF_CONTEXT_LINES = 3;

  function getDiffHunks() {
    var activePanel = document.querySelector('.fv-tab-content.active');
    if (!activePanel) activePanel = document;
    var lines = activePanel.querySelectorAll('.code-line.diff-added, .code-line.diff-removed');
    var hunks = [];
    var lastIdx = -2;
    lines.forEach(function(line) {
      var allLines = Array.from(line.closest('.code-lines').querySelectorAll('.code-line'));
      var idx = allLines.indexOf(line);
      if (idx - lastIdx > 1) hunks.push(line);
      lastIdx = idx;
    });
    return hunks;
  }

  var _diffCounterDismiss = null;

  function _clearDiffCounterListeners() {
    if (_diffCounterDismiss) {
      document.removeEventListener('click', _diffCounterDismiss);
      document.removeEventListener('keydown', _diffCounterDismiss);
      _diffCounterDismiss = null;
    }
  }

  function showDiffCounter() {
    var hunks = getDiffHunks();
    if (hunks.length === 0 || currentDiffIdx < 0) return;
    diffCounterBadge.textContent = (currentDiffIdx + 1) + '/' + hunks.length;
    diffCounterBadge.classList.add('visible');
    _clearDiffCounterListeners();
    _diffCounterDismiss = function(e) {
      if (e.type === 'keydown' && e.ctrlKey && e.key === 'd') return;
      diffCounterBadge.classList.remove('visible');
      document.querySelectorAll('.code-line.diff-focus').forEach(function(el) { el.classList.remove('diff-focus'); });
      _clearDiffCounterListeners();
    };
    setTimeout(function() {
      document.addEventListener('click', _diffCounterDismiss);
      document.addEventListener('keydown', _diffCounterDismiss);
    }, 100);
  }

  function jumpToDiff(direction) {
    var hunks = getDiffHunks();
    if (hunks.length === 0) return;
    currentDiffIdx += direction;
    if (currentDiffIdx >= hunks.length) currentDiffIdx = 0;
    if (currentDiffIdx < 0) currentDiffIdx = hunks.length - 1;
    document.querySelectorAll('.code-line.diff-focus').forEach(function(el) { el.classList.remove('diff-focus'); });
    var hunk = hunks[currentDiffIdx];
    var allLines = Array.from(hunk.closest('.code-lines').querySelectorAll('.code-line'));
    var startIdx = allLines.indexOf(hunk);
    for (var i = startIdx; i < allLines.length; i++) {
      if (allLines[i].classList.contains('diff-added') || allLines[i].classList.contains('diff-removed')) {
        allLines[i].classList.add('diff-focus');
      } else break;
    }
    hunk.scrollIntoView({ behavior: 'smooth', block: 'center' });
    showDiffCounter();
  }

  // Mark context lines around diff changes for collapsed mode
  function markDiffContext(panel) {
    var allCodeLines = panel.querySelectorAll('.code-lines');
    allCodeLines.forEach(function(codeBlock) {
      var lines = Array.from(codeBlock.querySelectorAll('.code-line'));
      var diffIndices = [];
      lines.forEach(function(line, idx) {
        if (line.classList.contains('diff-added') || line.classList.contains('diff-removed')) {
          diffIndices.push(idx);
        }
      });
      if (diffIndices.length === 0) return;
      // Mark context lines
      var contextSet = {};
      diffIndices.forEach(function(idx) {
        for (var c = Math.max(0, idx - DIFF_CONTEXT_LINES); c <= Math.min(lines.length - 1, idx + DIFF_CONTEXT_LINES); c++) {
          contextSet[c] = true;
        }
      });
      lines.forEach(function(line, idx) {
        if (contextSet[idx] && !line.classList.contains('diff-added') && !line.classList.contains('diff-removed')) {
          line.classList.add('diff-context');
        }
      });
      // Add separators between non-adjacent context groups
      var visibleIndices = Object.keys(contextSet).map(Number).concat(diffIndices).sort(function(a,b){return a-b;});
      var unique = visibleIndices.filter(function(v, i, a) { return !i || v !== a[i-1]; });

      function insertSeparator(beforeEl) {
        var spacerA = document.createElement('div');
        spacerA.className = 'code-line diff-spacer';
        spacerA.innerHTML = '<span class="ln"></span><span class="lc"></span>';
        var sep = document.createElement('div');
        sep.className = 'code-line diff-separator';
        sep.innerHTML = '<span class="ln"></span><span class="lc"></span>';
        var spacerB = document.createElement('div');
        spacerB.className = 'code-line diff-spacer';
        spacerB.innerHTML = '<span class="ln"></span><span class="lc"></span>';
        beforeEl.parentNode.insertBefore(spacerA, beforeEl);
        beforeEl.parentNode.insertBefore(sep, beforeEl);
        beforeEl.parentNode.insertBefore(spacerB, beforeEl);
      }

      function appendSeparator(afterEl) {
        var spacerA = document.createElement('div');
        spacerA.className = 'code-line diff-spacer';
        spacerA.innerHTML = '<span class="ln"></span><span class="lc"></span>';
        var sep = document.createElement('div');
        sep.className = 'code-line diff-separator';
        sep.innerHTML = '<span class="ln"></span><span class="lc"></span>';
        var spacerB = document.createElement('div');
        spacerB.className = 'code-line diff-spacer';
        spacerB.innerHTML = '<span class="ln"></span><span class="lc"></span>';
        afterEl.parentNode.appendChild(spacerA);
        afterEl.parentNode.appendChild(sep);
        afterEl.parentNode.appendChild(spacerB);
      }

      // Separator at top if first visible line isn't line 1
      if (unique.length > 0 && unique[0] > 0) {
        insertSeparator(lines[unique[0]]);
      }

      // Separators between non-adjacent groups
      for (var i = 1; i < unique.length; i++) {
        if (unique[i] - unique[i-1] > 1) {
          insertSeparator(lines[unique[i]]);
        }
      }

      // Separator at bottom if last visible line isn't the last line
      if (unique.length > 0 && unique[unique.length - 1] < lines.length - 1) {
        var lastVisible = lines[unique[unique.length - 1]];
        appendSeparator(lastVisible);
      }
    });
  }

  function toggleDiffCollapse() {
    var panel = document.querySelector('.fv-tab-content.active');
    if (!panel) return;
    // Skip if markdown preview is active (collapse only applies to raw/code view)
    var previewView = panel.querySelector('.fv-preview-view');
    if (previewView && previewView.style.display !== 'none') return;
    var hasDiffs = panel.querySelector('.code-line.diff-added, .code-line.diff-removed');
    if (!hasDiffs) return;
    // Skip for new files (all non-removed lines are added — nothing to collapse)
    var totalLines = panel.querySelectorAll('.code-line:not(.diff-removed)').length;
    var addedLines = panel.querySelectorAll('.code-line.diff-added').length;
    if (totalLines > 0 && addedLines === totalLines) return;
    var codeBlocks = panel.querySelectorAll('pre, .code-lines');
    codeBlocks.forEach(function(b) { b.style.transition = 'opacity 0.06s ease-out'; b.style.opacity = '0'; });
    setTimeout(function() {
      panel.classList.toggle('diff-collapsed');
      codeBlocks.forEach(function(b) { b.style.transition = 'opacity 0.08s ease-in'; b.style.opacity = '1'; });
      setTimeout(function() { codeBlocks.forEach(function(b) { b.style.transition = ''; }); }, 80);
    }, 60);
  }

  // Initialize collapsed diff mode — works on any root element
  function initDiffCollapseOn(root) {
    var panels = root.querySelectorAll('.fv-tab-content');
    panels.forEach(function(panel) {
      if (panel.querySelector('.code-line.diff-added, .code-line.diff-removed')) {
        markDiffContext(panel);
        panel.classList.add('diff-collapsed');
      }
    });
  }
  // Init diffs, then reveal content (hidden by #fv-init-hide style)
  initDiffCollapseOn(document.getElementById('fv-body-container'));
  var initHide = document.getElementById('fv-init-hide');
  if (initHide) initHide.remove();
  var pageLoader = document.getElementById('fv-page-loader');
  if (pageLoader) pageLoader.remove();
  var activeContent = document.querySelector('.fv-tab-content.active');
  if (activeContent) activeContent.classList.add('fv-reveal');

  function updateGroupCounts() {
    document.querySelectorAll('.fv-group-sel').forEach(function(sel) {
      var group = sel.getAttribute('data-group');
      var count = document.querySelectorAll('.fv-tab[data-group="' + group + '"][data-tab]').length;
      var badge = sel.querySelector('.fv-group-count');
      if (badge) badge.textContent = count;
    });
  }

  // Group selector bar — switch visible group
  function switchGroup(groupName) {
    document.querySelectorAll('.fv-group-sel').forEach(function(s) {
      s.classList.toggle('active', s.getAttribute('data-group') === groupName);
    });
    // Show only tabs from active group
    document.querySelectorAll('.fv-tab-bar .fv-tab[data-group]').forEach(function(t) {
      t.classList.toggle('fv-group-visible', t.getAttribute('data-group') === groupName);
    });
    // Show + button only for files group
    var addBtn = document.getElementById('fv-add-file');
    if (addBtn) addBtn.style.display = (groupName === 'files') ? '' : 'none';
    // Hide all loading panels, show the one for this group if loading
    document.querySelectorAll('[data-loading-group]').forEach(function(p) { p.classList.remove('active'); });
    var existingEmpty = document.getElementById('fv-group-empty');
    if (existingEmpty) existingEmpty.remove();

    // Check if this group is in loading state
    if (loadingGroups[groupName]) {
      document.querySelectorAll('.fv-tab-content.active').forEach(function(c) { c.classList.remove('active'); });
      var lp = document.getElementById(loadingGroups[groupName]);
      if (lp) lp.classList.add('active');
      return;
    }

    var hasVisibleTabs = document.querySelector('.fv-tab.fv-group-visible[data-tab]');
    if (!hasVisibleTabs) {
      document.querySelectorAll('.fv-tab-content.active').forEach(function(c) { c.classList.remove('active'); });
      var emptyDiv = document.createElement('div');
      emptyDiv.className = 'fv-tab-content active';
      emptyDiv.id = 'fv-group-empty';
      var isGit = groupName.indexOf('git.') === 0;
      var msg = isGit ? 'No changes on this branch' : 'Press Ctrl+O to open a file';
      emptyDiv.style.cssText = 'display:flex;align-items:center;justify-content:center;min-height:calc(100vh - 80px);color:#6a7080;font-size:13px;font-family:-apple-system,sans-serif';
      emptyDiv.textContent = msg;
      document.body.appendChild(emptyDiv);
    }
  }
  // Unwatch button on git groups
  function handleUnwatch(btn) {
    var repoName = btn.getAttribute('data-unwatch');
    if (!repoName) return;
    var groupName = 'git.' + repoName;
    // Find the group to the left before removing
    var sel = btn.closest('.fv-group-sel');
    var prevGroup = sel ? sel.previousElementSibling : null;
    while (prevGroup && !prevGroup.classList.contains('fv-group-sel')) {
      prevGroup = prevGroup.previousElementSibling;
    }
    var targetGroup = prevGroup ? prevGroup.getAttribute('data-group') : 'files';
    // Remove group selector from bar
    if (sel) sel.remove();
    // Remove all tabs and content panels for this group
    document.querySelectorAll('.fv-tab[data-group="' + groupName + '"]').forEach(function(t) { t.remove(); });
    document.querySelectorAll('.fv-tab-content').forEach(function(p) {
      if (p.id && p.id.indexOf('fv-tab-' + groupName + '-') === 0) p.remove();
    });
    // Remove loading panel if exists
    var lp = document.getElementById('fv-loading-' + groupName.replace(/\./g, '-'));
    if (lp) lp.remove();
    delete loadingGroups[groupName];
    // Switch to the group to the left
    switchGroup(targetGroup);
    var first = document.querySelector('.fv-tab.fv-group-visible[data-tab]');
    if (first) activateTab(first.getAttribute('data-tab'));
    fetch('/_unwatch?name=' + encodeURIComponent(repoName));
    showToast('Stopped watching ' + repoName + ' \u2713');
  }
  // Init: show active group's tabs (skip if hash already handled it)
  // Note: has-groups class is set in the HTML template so tab layout is correct
  // when hash-restore runs scrollIntoView (before this init code executes).
  var groupBar = document.querySelector('.fv-group-bar');
  var hashHandledGroup = hash && hash.indexOf('fv-group:') === 0;
  if (groupBar && !hashHandledGroup) {
    var activeGroupSel = document.querySelector('.fv-group-sel.active');
    if (activeGroupSel) switchGroup(activeGroupSel.getAttribute('data-group'));

  function toggleMdView() {
    var panel = document.querySelector('.fv-tab-content.active');
    if (!panel) return;
    var toggle = panel.querySelector('.fv-md-toggle');
    if (!toggle) return;

  // Search modal (Ctrl+P files, Ctrl+F text)
  var modalOverlay = document.getElementById('fv-modal-overlay');
  var modalInput = document.getElementById('fv-modal-input');
  var modalList = document.getElementById('fv-modal-list');
  var modalModeEl = document.getElementById('fv-modal-mode');
  var modalModeText = document.getElementById('fv-modal-mode-text');
  var modalRootEl = document.getElementById('fv-modal-root');
  var modalSelectedIdx = 0;
  var modalItems = [];
  var modalMode = 'files';
  var searchTimer = null;
  var currentSearchRoot = '';

  function fuzzyMatch(text, query) {
    var tl = text.toLowerCase();
    var ql = query.toLowerCase();
    var qi = 0;
    for (var ti = 0; ti < tl.length && qi < ql.length; ti++) {
      if (tl[ti] === ql[qi]) qi++;
    }
    return qi === ql.length;
  }

  function fuzzyHighlight(text, query) {
    var escaped = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    if (!query) return escaped;
    var ql = query.toLowerCase();
    var result = '';
    var qi = 0;
    for (var i = 0; i < escaped.length && qi < ql.length; i++) {
      if (escaped[i].toLowerCase() === ql[qi]) {
        result += '<mark>' + escaped[i] + '</mark>';
        qi++;
      } else {
        result += escaped[i];
      }
    }
    return result + escaped.slice(i);
  }

  function getTabData() {
    var tabs = document.querySelectorAll('.fv-tab[data-tab]');
    var data = [];
    tabs.forEach(function(tab) {
      var title = tab.getAttribute('title') || '';
      var fname = title.split('/').pop();
      var fpath = title;
      data.push({ tabId: tab.getAttribute('data-tab'), fname: fname, fpath: fpath });
    });
    return data;
  }

  function searchText(query, activeOnly) {
    if (!query || query.length < 2) return [];
    var results = [];
    var q = query.toLowerCase();
    var tabs = getTabData();
    var tabMap = {};
    tabs.forEach(function(t) { tabMap[t.tabId] = t; });
    var panels = activeOnly
      ? [document.querySelector('.fv-tab-content.active')].filter(Boolean)
      : document.querySelectorAll('.fv-tab-content');
    panels.forEach(function(panel) {
      var tabId = panel.id;
      var tab = tabMap[tabId];
      if (!tab) return;
      // Search code lines
      var lines = panel.querySelectorAll('.code-line');
      lines.forEach(function(line) {
        if (results.length >= 50) return;
        var lc = line.querySelector('.lc');
        if (!lc) return;
        var text = lc.textContent;
        if (fuzzyMatch(text, q)) {
          var ln = line.querySelector('.ln');
          var lineNum = ln ? ln.textContent.trim() : '?';
          results.push({ tabId: tabId, fname: tab.fname, lineNum: lineNum, lineEl: line, content: text });
        }
      });
      // Search rendered markdown content (headers, paragraphs, list items, etc.)
      var mdEls = panel.querySelectorAll('h1, h2, h3, h4, h5, h6, p, li, td, th, blockquote, a, strong, em, code:not(.code-line code)');
      var seen = new Set();
      mdEls.forEach(function(el) {
        if (results.length >= 50) return;
        if (el.closest('.code-line') || el.closest('.code-file-header')) return;
        var text = el.textContent;
        if (seen.has(text)) return;
        seen.add(text);
        if (fuzzyMatch(text, q)) {
          results.push({ tabId: tabId, fname: tab.fname, lineNum: '\u2014', lineEl: el, content: text.substring(0, 200) });
        }
      });
    });
    // Sort: exact substring matches first, then by match tightness
    results.sort(function(a, b) {
      var al = a.content.toLowerCase(), bl = b.content.toLowerCase();
      var aExact = al.indexOf(q) !== -1 ? 1 : 0;
      var bExact = bl.indexOf(q) !== -1 ? 1 : 0;
      return bExact - aExact;
    });
    return results;
  }

  function renderShortcutsModal(query) {
    var q = (query || '');
    var filtered = q ? shortcutsList.filter(function(s) {
      return fuzzyMatch(s.key, q) || fuzzyMatch(s.desc, q);
    }) : shortcutsList;
    modalItems = [];
    modalList.innerHTML = filtered.length ? filtered.map(function(s) {
      return '<li class="fv-modal-item shortcut-item">' +
        '<span class="fv-shortcut-key">' + (q ? fuzzyHighlight(s.key, q) : s.key) + '</span>' +
        '<span class="fv-shortcut-desc">' + (q ? fuzzyHighlight(s.desc, q) : s.desc) + '</span></li>';
    }).join('') : emptyState('No matching shortcuts');
  }

  function renderTextSearchModal(query) {
    if (!query || query.length < 2) { modalItems = []; modalList.innerHTML = emptyState('Type to search\u2026'); return; }
    var results = searchText(query, modalMode === 'text-active');
    modalItems = results;
    modalSelectedIdx = Math.min(modalSelectedIdx, Math.max(0, modalItems.length - 1));
    modalList.innerHTML = modalItems.length ? modalItems.map(function(item, i) {
      var cls = 'fv-modal-item text-result' + (i === modalSelectedIdx ? ' selected' : '');
      var highlighted = fuzzyHighlight(item.content, query);
      return '<li class="' + cls + '" data-idx="' + i + '">' +
        '<span class="fv-modal-fname">' + item.fname + '<span class="fv-modal-line">:' + item.lineNum + '</span></span>' +
        '<span class="fv-modal-content">' + highlighted.trim() + '</span></li>';
    }).join('') : emptyState('No results');
  }

  function getGroupData() {
    var groups = [];
    document.querySelectorAll('.fv-group-sel').forEach(function(sel) {
      var g = sel.getAttribute('data-group');
      var label = sel.textContent.replace(/\d+$/, '').replace(/×$/, '').trim();
      var count = sel.querySelector('.fv-group-count');
      groups.push({ group: g, label: label, count: count ? count.textContent : '0', isGroup: true });
    });
    return groups;
  }

  function renderFileSearchModal(query) {
    var tabs = getTabData();
    var groups = document.querySelector('.fv-group-bar') ? getGroupData() : [];
    var q = (query || '');

    // Filter groups and tabs
    var filteredGroups = q ? groups.filter(function(g) {
      return fuzzyMatch(g.label, q) || fuzzyMatch(g.group, q);
    }) : groups;
    var filteredTabs = q ? tabs.filter(function(t) {
      return fuzzyMatch(t.fname, q) || fuzzyMatch(t.fpath, q);
    }) : tabs;

    // Merge: groups first, then tabs
    modalItems = [];
    filteredGroups.forEach(function(g) { modalItems.push(g); });
    filteredTabs.forEach(function(t) { modalItems.push(t); });

    modalSelectedIdx = Math.min(modalSelectedIdx, Math.max(0, modalItems.length - 1));
    modalList.innerHTML = modalItems.length ? modalItems.map(function(item, i) {
      var cls = 'fv-modal-item' + (i === modalSelectedIdx ? ' selected' : '');
      if (item.isGroup) {
        return '<li class="' + cls + '" data-idx="' + i + '"><span class="fv-modal-fname" style="color:#a78bfa">' +
          (q ? fuzzyHighlight(item.label, q) : escHtml(item.label)) + '</span><span class="fv-group-count">' + item.count + '</span></li>';
      }
      return '<li class="' + cls + '" data-idx="' + i + '"><span class="fv-modal-fname">' +
        (q ? fuzzyHighlight(item.fname, q) : item.fname) + '</span><span class="fv-modal-fpath">' + item.fpath + '</span></li>';
    }).join('') : emptyState(q ? 'No matching tabs' : 'No tabs open');
  }

  var fsSearchAbort = null;

  function showLoading() {
    modalList.innerHTML = '<li class="fv-modal-loading">Searching</li>';
  }
  function emptyState(msg) {
    return '<li class="fv-modal-empty">' + msg + '</li>';
  }

  function fetchFsTextSearch(query) {
    if (fsSearchAbort) fsSearchAbort.abort();
    if (!query || query.length < 2) { modalItems = []; modalList.innerHTML = emptyState('Type to search\u2026'); return; }
    showLoading();
    fsSearchAbort = new AbortController();
    fetch('/_search-text?q=' + encodeURIComponent(query) + '&limit=50', { signal: fsSearchAbort.signal })
      .then(function(r) { return r.json(); })
      .then(function(results) {
        var openPaths = getOpenFilePaths();
        modalItems = results.filter(function(item) {
          return !openPaths[item.file.toLowerCase()];
        });
        modalSelectedIdx = Math.min(modalSelectedIdx, Math.max(0, modalItems.length - 1));
        var q = query.toLowerCase();
        modalList.innerHTML = modalItems.length ? modalItems.map(function(item, i) {
          var cls = 'fv-modal-item text-result' + (i === modalSelectedIdx ? ' selected' : '');
          var escapedContent = item.content.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
          if (q) {
            var re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
            escapedContent = escapedContent.replace(re, '<mark>$1</mark>');
          }
          return '<li class="' + cls + '" data-idx="' + i + '">' +
            '<span class="fv-modal-fname">' + item.fname + '<span class="fv-modal-line">:' + item.line + '</span></span>' +
            '<span class="fv-modal-content">' + escapedContent.trim() + '</span></li>';
        }).join('') : '<li class="fv-modal-empty">No results</li>';
      })
      .catch(function() {});
  }

  function relPath(fullPath) {
    if (currentSearchRoot && fullPath.indexOf(currentSearchRoot) === 0) {
      var rel = fullPath.slice(currentSearchRoot.length);
      if (rel.charAt(0) === '/') rel = rel.slice(1);
      return rel;
    }
    return fullPath;
  }

  var fsFileQuery = '';
  function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function renderFsFileItem(item, i) {
    var cls = 'fv-modal-item' + (i === modalSelectedIdx ? ' selected' : '');
    var rel = relPath(item.fpath);
    var dir = rel.lastIndexOf('/') >= 0 ? rel.slice(0, rel.lastIndexOf('/')) : '';
    var fname = fsFileQuery ? fuzzyHighlight(item.fname, fsFileQuery) : escHtml(item.fname);
    return '<li class="' + cls + '" data-idx="' + i + '"><span class="fv-modal-fname">' +
      fname + '</span>' + (dir ? '<span class="fv-modal-fpath">' + escHtml(dir) + '</span>' : '') + '</li>';
  }

  function getOpenFilePaths() {
    var paths = {};
    document.querySelectorAll('.fv-tab[data-tab]').forEach(function(tab) {
      var p = (tab.getAttribute('title') || '').toLowerCase();
      if (p) paths[p] = true;
    });
    return paths;
  }

  function fetchFsFileSearch(query) {
    if (fsSearchAbort) fsSearchAbort.abort();
    showLoading();
    fsFileQuery = query || '';
    fsSearchAbort = new AbortController();
    fetch('/_search-files?q=' + encodeURIComponent(query) + '&limit=50', { signal: fsSearchAbort.signal })
      .then(function(r) { return r.json(); })
      .then(function(results) {
        var openPaths = getOpenFilePaths();
        modalItems = results.filter(function(item) {
          return !openPaths[item.file.toLowerCase()];
        });
        modalSelectedIdx = Math.min(modalSelectedIdx, Math.max(0, modalItems.length - 1));
        modalList.innerHTML = modalItems.length ? modalItems.map(renderFsFileItem).join('')
          : '<li class="fv-modal-empty">No results</li>';
      })
      .catch(function() {});
  }

  function renderModal(query) {
    if (modalMode === 'shortcuts') return renderShortcutsModal(query);
    if (modalMode === 'fs-text') return fetchFsTextSearch(query);
    if (modalMode === 'fs-files') return fetchFsFileSearch(query);
    if (modalMode === 'text' || modalMode === 'text-active') return renderTextSearchModal(query);
    renderFileSearchModal(query);
  }

  var shortcutsList = [
    { key: 'Ctrl+F', desc: 'Find text in current tab' },
    { key: 'Ctrl+G', desc: 'Find text in all open tabs' },
    { key: 'Ctrl+H', desc: 'Find text and open file' },
    { key: 'Ctrl+O', desc: 'Open file by name' },
    { key: 'Ctrl+P', desc: 'Find tab by name' },
    { key: 'Ctrl+D', desc: 'Jump to next diff' },
    { key: 'Ctrl+X', desc: 'Toggle collapsed/expanded diff' },
    { key: 'Ctrl+E', desc: 'Toggle raw/preview (markdown)' },
    { key: 'Ctrl+C', desc: 'Copy file path' },
    { key: 'Ctrl+J', desc: 'Open file in Cursor' },
    { key: 'Ctrl+K', desc: 'Open workspace in Cursor' },
    { key: 'Ctrl+]', desc: 'Next tab' },
    { key: 'Ctrl+[', desc: 'Previous tab' },
    { key: 'Ctrl+W', desc: 'Close tab' },
    { key: 'Ctrl+I', desc: 'Watch repository' },
    { key: 'Ctrl+/', desc: 'Settings' },
    { key: 'Esc', desc: 'Close dialog' }
  ];

  var modalModeConfig = {
    'fs-text':     { placeholder: 'Find text and open...',     label: '<span style="color:#ffcc66">Find &amp; Open</span> \u00b7 Ctrl+O to open file' },
    'fs-files':    { placeholder: 'Open file...',             label: '<span style="color:#ffcc66">Open</span> \u00b7 Ctrl+H to find text' },
    'files':       { placeholder: 'Find tab...',              label: '<span style="color:#ffcc66">Tabs</span> \u00b7 Ctrl+F to find text' },
    'text':        { placeholder: 'Find in all tabs...',      label: '<span style="color:#ffcc66">All Tabs</span> \u00b7 Ctrl+F for current tab' },
    'text-active': { placeholder: 'Find in current tab...',   label: '<span style="color:#ffcc66">Current Tab</span> \u00b7 Ctrl+G for all tabs' },
    'shortcuts':   { placeholder: 'Filter shortcuts...',       label: 'Keyboard Shortcuts' }
  };

  function isFsMode(m) { return m === 'fs-text' || m === 'fs-files'; }

  function updateSearchRootDisplay() {
    if (!isFsMode(modalMode)) {
      modalRootEl.style.display = 'none';
      return;
    }
    modalRootEl.style.display = '';
    modalRootEl.textContent = currentSearchRoot || '~';
    modalRootEl.title = 'Search root: ' + (currentSearchRoot || '~') + ' (click to change)';
  }

  function fetchSearchRoot() {
    fetch('/_search-root')
      .then(function(r) { return r.json(); })
      .then(function(data) {
        currentSearchRoot = data.root;
        updateSearchRootDisplay();
      })
      .catch(function() {});
  }

  function startEditSearchRoot() {
    var input = document.createElement('input');
    input.className = 'fv-modal-root-input';
    input.value = currentSearchRoot || '';
    input.placeholder = '~/path/to/project';
    modalRootEl.style.display = 'none';
    modalRootEl.parentNode.appendChild(input);
    input.focus();
    input.select();
    function commit() {
      var val = input.value.trim();
      if (val && val !== currentSearchRoot) {
        fetch('/_search-root?path=' + encodeURIComponent(val))
          .then(function(r) { return r.json(); })
          .then(function(data) {
            currentSearchRoot = data.root;
            updateSearchRootDisplay();
          });
      }
      input.remove();
      modalRootEl.style.display = '';
      modalInput.focus();
    }
    input.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') { e.preventDefault(); e.stopPropagation(); commit(); }
      if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); input.remove(); modalRootEl.style.display = ''; modalInput.focus(); }
    });
    input.addEventListener('blur', commit);
  }

  modalRootEl.addEventListener('click', function(e) {
    e.stopPropagation();
    startEditSearchRoot();
  });

  function openModal(mode) {
    modalMode = mode || 'files';
    modalInput.value = '';
    modalSelectedIdx = 0;
    var cfg = modalModeConfig[modalMode] || modalModeConfig['files'];
    modalInput.style.display = '';
    modalInput.placeholder = cfg.placeholder;
    modalModeText.innerHTML = cfg.label;
    if (isFsMode(modalMode)) {
      fetchSearchRoot();
    }
    updateSearchRootDisplay();
    renderModal('');
    modalOverlay.classList.add('visible');
    setTimeout(function() { modalInput.focus(); }, 50);
  }

  function closeModal() {
    clearTimeout(searchTimer);
    if (fsSearchAbort) { fsSearchAbort.abort(); fsSearchAbort = null; }
    modalOverlay.classList.remove('visible');
  }

  function highlightLineUntilDismiss(lineEl) {
    lineEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
    lineEl.classList.add('search-highlight');
    function clear() {
      document.querySelectorAll('.search-highlight').forEach(function(el) { el.classList.remove('search-highlight'); });
      document.removeEventListener('click', clear);
      document.removeEventListener('keydown', clear);
    }
    setTimeout(function() {
      document.addEventListener('click', clear, { once: true });
      document.addEventListener('keydown', clear, { once: true });
    }, 100);
  }

  function updateModalSelection() {
    var items = modalList.querySelectorAll('.fv-modal-item');
    items.forEach(function(el, i) {
      el.classList.toggle('selected', i === modalSelectedIdx);
    });
    var sel = modalList.querySelector('.fv-modal-item.selected');
    if (sel) sel.scrollIntoView({ block: 'nearest' });
  }

  function createLoadingTab(filePath) {
    var fname = filePath.split('/').pop();
    var tabBar = document.querySelector('.fv-tab-bar');
    var safeFname = escHtml(fname);
    var tabId = 'fv-tab-loading-' + Date.now();

    // Determine file icon from extension
    var codeExts = /\.(ts|tsx|js|jsx|mjs|cjs|py|rb|go|rs|java|kt|swift|c|cc|cpp|h|hpp|cs|fs|fsx|sh|bash|zsh|yaml|yml|toml|json|jsonc|sql|graphql|gql|html|css|scss|sass|less|lua|php|r|m|ex|exs|tf|hcl|vue|svelte)$/i;
    var codeNames = /^(Dockerfile|Makefile|Vagrantfile|Procfile|Brewfile)$/;
    var isCode = codeExts.test(fname) || codeNames.test(fname);
    var tabIcon = isCode ? '<svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor" style="vertical-align:-2px;margin-right:4px;opacity:0.6"><path d="m11.28 3.22 4.25 4.25a.75.75 0 0 1 0 1.06l-4.25 4.25a.749.749 0 0 1-1.275-.326.749.749 0 0 1 .215-.734L13.94 8l-3.72-3.72a.749.749 0 0 1 .326-1.275.749.749 0 0 1 .734.215Zm-6.56 0a.751.751 0 0 1 1.042.018.751.751 0 0 1 .018 1.042L2.06 8l3.72 3.72a.749.749 0 0 1-.326 1.275.749.749 0 0 1-.734-.215L.47 8.53a.75.75 0 0 1 0-1.06Z"/></svg>' : '';

    // Create tab header
    var tab = document.createElement('div');
    tab.className = 'fv-tab loading';
    tab.setAttribute('data-tab', tabId);
    tab.setAttribute('title', filePath);
    tab.innerHTML = tabIcon + safeFname + '<span class="fv-tab-close" data-close-path="' + escHtml(filePath) + '">\u00d7</span>';
    tab.setAttribute('data-group', 'files');
    tab.classList.add('fv-group-visible');
    var addFileBtn = document.getElementById('fv-add-file');
    if (addFileBtn) {
      tabBar.insertBefore(tab, addFileBtn);
    } else {
      tabBar.insertBefore(tab, tabBar.querySelector('.fv-tab-spacer'));
    }

    // Create content panel with centered loading spinner
    var panel = document.createElement('div');
    panel.className = 'fv-tab-content';
    panel.id = tabId;
    panel.innerHTML = '<div class="fv-tab-loading-content">Loading ' + safeFname + '\u2026</div>';
    document.body.appendChild(panel);

    updateGroupCounts();

    // Track last opened file for reliable swap restoration
    lastOpenedFilePath = filePath;

    // Switch to files group and activate the loading tab immediately
    var activeGroup = document.querySelector('.fv-group-sel.active');
    if (activeGroup && activeGroup.getAttribute('data-group') !== 'files') {
      switchGroup('files');
    }
    activateTab(tabId);
    // Set hash to file path — pollReload will preserve this if user stays,
    // or overwrite with the user's actual active tab if they navigate away
    history.replaceState(null, '', '#fv-path:' + encodeURIComponent(filePath));

    // Allow clicking back to loading tab if user navigates away
    tab.addEventListener('click', function(e) {
      if (e.target.classList.contains('fv-tab-close')) return;
      activateTab(tabId);
      history.replaceState(null, '', '#fv-path:' + encodeURIComponent(filePath));
    });
  }

  function selectModalItem() {
    if (modalItems.length === 0) return;
    var item = modalItems[modalSelectedIdx];
    // Handle group selection from Ctrl+P
    if (item.isGroup) {
      closeModal();
      switchGroup(item.group);
      var first = document.querySelector('.fv-tab.fv-group-visible[data-tab]');
      if (first) {
        activateTab(first.getAttribute('data-tab'));
        history.replaceState(null, '', '#' + first.getAttribute('data-tab'));
      }
      return;
    }
    if (modalMode === 'fs-text' || modalMode === 'fs-files') {
      var filePath = item.file;
      closeModal();
      createLoadingTab(filePath);
      lastOpenTriggered = Date.now();
      fetch('/_open?path=' + encodeURIComponent(filePath));
      return;
    }
    var wasText = modalMode === 'text' || modalMode === 'text-active';
    activateTab(item.tabId);
    history.replaceState(null, '', '#' + item.tabId);
    closeModal();
    if (wasText && item.lineEl) {
      setTimeout(function() { highlightLineUntilDismiss(item.lineEl); }, 50);
    }
    currentDiffIdx = -1;
  }

  function getActiveFilePath() {
    var tab = document.querySelector('.fv-tab.active');
    return tab ? tab.getAttribute('title') : '';
  }

  var toastEl = document.getElementById('fv-toast');
  var toastTimer = null;
  function showToast(msg, persistent, withSpinner) {
    clearTimeout(toastTimer);
    if (withSpinner) {
      toastEl.innerHTML = '<span style="display:inline-flex;align-items:center;gap:8px"><span style="display:inline-block;width:11px;height:11px;border:2px solid rgba(115,184,240,0.3);border-top-color:#73b8f0;border-radius:50%;animation:fv-spin 0.7s linear infinite;flex-shrink:0"></span>' + msg + '</span>';
    } else {
      toastEl.textContent = msg;
    }
    toastEl.classList.add('visible');
    if (!persistent) {
      toastTimer = setTimeout(function() { toastEl.classList.remove('visible'); }, 1500);
    }
  }

  function copyToClipboard(text) {
    navigator.clipboard.writeText(text).catch(function() {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    });
  }

  function toggleModal(mode) {
    if (modalOverlay.classList.contains('visible') && modalMode === mode) closeModal();
    else openModal(mode);
  }

  function cycleTab(direction) {
    var hasGroups = !!document.querySelector('.fv-group-bar');
    var tabs = hasGroups
      ? Array.from(document.querySelectorAll('.fv-tab.fv-group-visible[data-tab]'))
      : Array.from(document.querySelectorAll('.fv-tab[data-tab]'));
    if (tabs.length === 0 && !hasGroups) return;
    var activeIdx = tabs.findIndex(function(t) { return t.classList.contains('active'); });

    if (hasGroups) {
      var atEnd = tabs.length === 0 || (direction > 0 && activeIdx >= tabs.length - 1) || (direction < 0 && activeIdx <= 0);
      if (atEnd) {
        // Move to next/previous group (skip empty groups, no wrapping)
        var groupSels = Array.from(document.querySelectorAll('.fv-group-sel'));
        var activeGroupIdx = groupSels.findIndex(function(s) { return s.classList.contains('active'); });
        // Check bounds — don't wrap
        if (direction > 0 && activeGroupIdx >= groupSels.length - 1) return;
        if (direction < 0 && activeGroupIdx <= 0) return;
        for (var i = activeGroupIdx + direction; i >= 0 && i < groupSels.length; i += direction) {
          var newGroup = groupSels[i].getAttribute('data-group');
          switchGroup(newGroup);
          var newTabs = Array.from(document.querySelectorAll('.fv-tab.fv-group-visible[data-tab]'));
          if (newTabs.length > 0) {
            var target = direction > 0 ? newTabs[0] : newTabs[newTabs.length - 1];
            activateTab(target.getAttribute('data-tab'));
            history.replaceState(null, '', '#' + target.getAttribute('data-tab'));
            break;
          }
          // Empty group — show its empty state but keep going if possible
        }
        currentDiffIdx = -1;
        return;
      }
    }

    if (tabs.length < 2) return;
    // No wrapping within a group either
    var newIdx = activeIdx + direction;
    if (newIdx < 0 || newIdx >= tabs.length) return;
    var newTabId = tabs[newIdx].getAttribute('data-tab');
    activateTab(newTabId);
    history.replaceState(null, '', '#' + newTabId);
    currentDiffIdx = -1;
  }

  function closeActiveTab() {
    var tab = document.querySelector('.fv-tab.active');
    if (tab && tab.getAttribute('data-group') !== 'git') {
      var closeBtn = tab.querySelector('.fv-tab-close');
      if (closeBtn) closeBtn.click();
    }
  }

  document.addEventListener('keydown', function(e) {
    if (e.ctrlKey) {
      switch (e.key) {
        case 't': e.preventDefault(); window.scrollTo({ top: 0, behavior: 'smooth' }); return;
        case 'b': e.preventDefault(); window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }); return;
        case 'f': e.preventDefault(); toggleModal('text-active'); return;
        case 'g': e.preventDefault(); toggleModal('text'); return;
        case 'h': e.preventDefault(); toggleModal('fs-text'); return;
        case 'o': e.preventDefault(); toggleModal('fs-files'); return;
        case 'p': e.preventDefault(); toggleModal('files'); return;
        case 's': e.preventDefault(); return;
        case 'i': e.preventDefault(); if (gitWatchOverlay && gitWatchOverlay.classList.contains('visible')) closeGitWatch(); else openGitWatch(); return;
        case '/': case '?': e.preventDefault(); if (settingsOverlay.classList.contains('visible')) closeSettings(); else openSettings(); return;
        case 'd': e.preventDefault(); jumpToDiff(1); return;
        case 'x': e.preventDefault(); toggleDiffCollapse(); return;
        case 'e': e.preventDefault(); toggleMdView(); return;
        case 'c': e.preventDefault(); var fp = getActiveFilePath(); if (fp) copyToClipboard(fp); return;
        case 'j': e.preventDefault(); var fp2 = getActiveFilePath(); if (fp2) { fetch('/_open-in-editor?path=' + encodeURIComponent(fp2)); showToast('Opened file in Cursor \u2713'); } return;
        case 'k': e.preventDefault(); var fp3 = getActiveFilePath(); if (fp3) { fetch('/_open-workspace?path=' + encodeURIComponent(fp3)); showToast('Opened workspace in Cursor \u2713'); } return;
        case ']': e.preventDefault(); cycleTab(1); return;
        case '[': e.preventDefault(); cycleTab(-1); return;
        case 'w': e.preventDefault(); closeActiveTab(); return;
      }
    }
    if (gitWatchOverlay && gitWatchOverlay.classList.contains('visible')) {
      if (e.key === 'Escape') { closeGitWatch(); e.preventDefault(); }
      return;
    }
    if (settingsOverlay.classList.contains('visible')) {
      if (e.key === 'Escape') { closeSettings(); e.preventDefault(); }
      return;
    }
    if (!modalOverlay.classList.contains('visible')) return;
    if (e.key === 'Escape') { closeModal(); e.preventDefault(); }
    if (e.key === 'ArrowDown') { modalSelectedIdx = Math.min(modalSelectedIdx + 1, modalItems.length - 1); updateModalSelection(); e.preventDefault(); }
    if (e.key === 'ArrowUp') { modalSelectedIdx = Math.max(modalSelectedIdx - 1, 0); updateModalSelection(); e.preventDefault(); }
    if (e.key === 'Enter') { selectModalItem(); e.preventDefault(); }
  });

  modalInput.addEventListener('input', function() {
    modalSelectedIdx = 0;
    if (modalMode === 'fs-text' || modalMode === 'fs-files') {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(function() { renderModal(modalInput.value); }, 250);
    } else if (modalMode === 'text' || modalMode === 'text-active') {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(function() { renderModal(modalInput.value); }, 150);
    } else {
      renderModal(modalInput.value);
    }
  });

  modalList.addEventListener('click', function(e) {
    var li = e.target.closest('.fv-modal-item');
    if (li) { modalSelectedIdx = parseInt(li.getAttribute('data-idx'), 10); selectModalItem(); }
  });

  modalOverlay.addEventListener('click', function(e) {
    if (e.target === modalOverlay) closeModal();
  });
})();
</script>
</body>
</html>
