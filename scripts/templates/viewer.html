<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; }
body {

/* Tab bar */

.fv-tab {

  font-size: 12px;
  font-family: -apple-system, sans-serif;
  color: #6a7080;

}

}

.fv-tab.active { color: #e8ecf0; background: #1f2430; }

}
.fv-tab-spacer { flex: 1; }
.fv-tab-action { padding: 6px 4px; color: #4b5263; cursor: pointer; display: flex; align-items: center; position: sticky; right: 0; background: inherit; }
.fv-tab-action:hover { color: #ccd0d4; }
#fv-settings-btn { font-size: 15px; }
/* Group selector bar */
.fv-group-bar { display: flex; align-items: center; background: #171b24; border-bottom: 1px solid #252a35; position: sticky; top: 0; z-index: 101; padding: 0 4px; }
.fv-group-sel { padding: 5px 10px; font-size: 11px; font-family: -apple-system, sans-serif; color: #4b5263; cursor: pointer; user-select: none; white-space: nowrap; border-bottom: 2px solid transparent; transition: color 0.1s; }
.fv-group-sel:hover { color: #8a90a0; }

.fv-group-close:hover { color: #ff5f57; }

.fv-group-add:hover { color: #ccd0d4; }

.fv-md-toggle-btn:hover { color: #ccd0d4; }
.fv-md-toggle-btn.active { color: #e8ecf0; background: #353b4a; }
.fv-tab-ts { display: none; }
.fv-tab-content { display: none; padding: 14px 18px; }
.fv-tab-content.active { display: block; }

/* Content styles */

h1 { font-size: 1.35em; } h2 { font-size: 1.15em; } h3 { font-size: 1em; }
code { background: #2a3040; padding: 1px 5px; border-radius: 3px; font-size: 0.9em; color: #ffcc66; font-family: "JetBrains Mono", "Fira Code", "SF Mono", Menlo, monospace; }
pre { background: #282c34; border-radius: 6px; overflow-x: auto; margin: 8px 0; border: 1px solid #353b4a; padding: 0 !important; }
pre code { padding: 0 !important; background: none !important; font-size: 0.88em; font-family: "JetBrains Mono", "Fira Code", "SF Mono", Menlo, monospace; }
div.sourceCode { margin: 8px 0; }
.code-lines { display: table; min-width: 100%; border-collapse: collapse; margin: 8px 0; }
.code-line { display: table-row; }
.code-line:hover { background: rgba(255,255,255,0.03); }

.search-highlight:not(.code-line) { background: rgba(226, 196, 108, 0.25); border-radius: 3px; box-shadow: 0 0 0 3px rgba(226, 196, 108, 0.25); }
/* Diff navigation arrows */

.diff-collapsed .code-line { display: none; }
.diff-collapsed .code-line.diff-added,
.diff-collapsed .code-line.diff-removed,
.diff-collapsed .code-line.diff-context { display: table-row; }

.diff-collapsed .code-line.diff-spacer { display: table-row; }

.diff-collapsed .code-line.diff-spacer .ln,
.diff-collapsed .code-line.diff-spacer .lc { background: transparent; padding: 6px 0; border: none; height: 0; }
.diff-collapsed pre { overflow-x: hidden; }
.diff-collapsed .code-line .lc { width: 100%; }
/* Diff counter badge */
.diff-counter-badge { position: fixed; bottom: 16px; left: 16px; background: #2a3040; border: 1px solid #353b4a; border-radius: 6px; padding: 4px 12px; font-size: 12px; font-family: "JetBrains Mono", monospace; color: #ccd0d4; z-index: 200; display: none; user-select: none; }
.diff-counter-badge.visible { display: block; }
.diff-view-mode { display: none; font-size: 10px; color: #a78bfa; font-family: -apple-system, sans-serif; padding: 2px 8px; background: rgba(167, 139, 250, 0.1); border: 1px solid rgba(167, 139, 250, 0.3); border-radius: 4px; text-transform: uppercase; letter-spacing: 0.5px; margin-left: 8px; }
.diff-collapsed .diff-view-mode { display: inline-block; }
.diff-stats { display: inline-flex; gap: 6px; margin-left: 8px; font-size: 11px; font-family: "JetBrains Mono", monospace; }
.diff-stat-add { color: #28c840; }
.diff-stat-rem { color: #ff5f57; }

.fv-modal-overlay.visible { display: flex; justify-content: center; padding-top: 60px; }
.fv-modal { width: 640px; max-width: 70vw; max-height: 380px; background: #1f2430; border: 1px solid #353b4a; border-radius: 8px; box-shadow: 0 8px 32px rgba(0,0,0,0.5); display: flex; flex-direction: column; overflow: hidden; }

@keyframes fv-spin { to { transform: rotate(360deg); } }

.fv-tab-loading-content::before { content: ''; display: block; width: 32px; height: 32px; border: 3px solid #353b4a; border-top-color: #ccd0d4; border-radius: 50%; animation: fv-spin 0.7s linear infinite; }

.dot-red { background: #ff5f57; } .dot-yellow { background: #febc2e; } .dot-green { background: #28c840; }
.code-file-header .filename { color: #ccd0d4; font-weight: 500; margin-left: 4px; }
.code-file-header .lang-badge { background: #353b4a; padding: 2px 8px; border-radius: 4px; font-size: 10px; color: #8a90a0; text-transform: uppercase; letter-spacing: 0.5px; margin-left: auto; }
.diff-collapsed .code-file-header .lang-badge { margin-left: auto; }
.code-file-wrapper pre { border: none; border-radius: 0; margin: 0; }
blockquote { border-left: 3px solid #87d96c; padding-left: 10px; color: #8a90a0; margin: 6px 0; }
ul, ol { padding-left: 20px; margin: 6px 0; } li { margin-bottom: 2px; }
a { color: #73b8f0; } hr { border: none; border-top: 1px solid #353b4a; margin: 10px 0; }
p { margin: 5px 0; }
strong { color: #e8ecf0; }
table { width: auto; border-collapse: collapse; margin: 10px 0; border: 1px solid #4a5568; table-layout: auto; }
th { background: #2d3748; padding: 8px 12px; text-align: left !important; border: 1px solid #4a5568; font-weight: 600; }
td { padding: 8px 12px; border: 1px solid #4a5568; text-align: left !important; }
tr:hover { background: #2a3040; }

@media (prefers-color-scheme: light) {
  body { color: #24292e; background: #ffffff; }
  .fv-tab-bar { background: #eaecef; border-bottom-color: #d0d7de; }
  .fv-tab { color: #6a737d; border-right-color: #d0d7de; }
  .fv-tab:hover { color: #24292e; background: #ffffff; }
  .fv-tab.active { color: #24292e; background: #ffffff; }
  .fv-tab.active::after { background: #0366d6; }
  .fv-tab-close { color: #9ca3af; }
  .fv-tab-close:hover { color: #d1242f; background: rgba(209,36,47,0.1); }
  .fv-tab-ts { color: #9ca3af; }
  h1, h2, h3 { color: #1a1a1a; border-bottom-color: #e1e4e8; }
  code { background: #f0f2f5; color: #c45100; }
  pre { background: #fafafa; border-color: #e1e4e8; }
  blockquote { border-left-color: #3fb950; color: #6a737d; }
  a { color: #0366d6; }
  hr { border-top-color: #e1e4e8; }
  strong { color: #1a1a1a; }
  table { border-color: #d0d7de; }
  th { background: #f6f8fa; border-color: #d0d7de; }
  td { border-color: #d0d7de; }
  tr:hover { background: #f6f8fa; }
  .code-file-wrapper { border-color: #e1e4e8; }
  .code-file-header { background: #f6f8fa; border-bottom-color: #e1e4e8; }
  .code-file-header .filename { color: #24292e; }
  .code-file-header .lang-badge { background: #e1e4e8; color: #6a737d; }
}
</style>
$theme_style$
</head>
<body>
<div id="fv-page-loader" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:9999">
  <div style="width:32px;height:32px;border:3px solid #353b4a;border-top-color:#ccd0d4;border-radius:50%;animation:fv-spin 0.7s linear infinite"></div>
</div>
<div id="fv-body-container">
$body$
</div>
<div class="diff-counter-badge" id="diff-counter-badge"></div>
<div class="fv-toast" id="fv-toast"></div>
<div class="fv-settings-overlay" id="fv-settings-overlay">
  <div class="fv-settings">
    <div class="fv-settings-sidebar">
      <div class="fv-settings-sidebar-title">Settings</div>
      <div class="fv-settings-nav-item active" data-section="appearance">Appearance</div>
      <div class="fv-settings-nav-item" data-section="git">Git</div>
      <div class="fv-settings-nav-item" data-section="shortcuts">Shortcuts</div>
    </div>
    <div class="fv-settings-main">
      <div class="fv-settings-topbar">
        <span id="fv-settings-section-title">Appearance</span>
        <div class="fv-settings-close" id="fv-settings-close">&times;</div>
      </div>
      <!-- Appearance -->
      <div class="fv-settings-pane active" id="fv-settings-pane-appearance">
        <div class="fv-settings-section">Theme</div>
        <div class="fv-theme-grid" id="fv-theme-grid"></div>
      </div>
      <!-- Git -->
      <div class="fv-settings-pane" id="fv-settings-pane-git">
        <div class="fv-settings-section">Diff View</div>
        <div style="display:flex;gap:8px;margin-bottom:18px">
          <div class="fv-theme-card" id="fv-git-mode-branch" style="flex:1;cursor:pointer">
            <div style="padding:10px 12px;font-size:12px;font-family:-apple-system,sans-serif">
              <div style="font-weight:600;margin-bottom:4px">Branch changes</div>
              <div style="color:#6a7080;font-size:11px">All changes since branching from main (PR view)</div>
            </div>
          </div>
          <div class="fv-theme-card" id="fv-git-mode-local" style="flex:1;cursor:pointer">
            <div style="padding:10px 12px;font-size:12px;font-family:-apple-system,sans-serif">
              <div style="font-weight:600;margin-bottom:4px">Local changes</div>
              <div style="color:#6a7080;font-size:11px">Only uncommitted and staged changes</div>
            </div>
          </div>
        </div>
        <div style="margin-top:4px;font-size:11px;color:#6a7080;font-family:-apple-system,sans-serif">Use <span style="color:#ccd0d4">Ctrl+I</span> to watch a new repository.</div>
      </div>
      <!-- Shortcuts -->
      <div class="fv-settings-pane" id="fv-settings-pane-shortcuts"></div>
    </div>
  </div>
</div>
<div class="fv-settings-overlay" id="fv-git-watch-overlay">
  <div class="fv-settings" style="width:560px;max-height:160px;position:relative">
    <div class="fv-settings-close" id="fv-git-watch-close" style="position:absolute;top:10px;right:10px;z-index:1">&times;</div>
    <div style="padding:16px 18px;width:100%">
      <div style="font-size:12px;font-weight:600;color:#e8ecf0;font-family:-apple-system,sans-serif;margin-bottom:12px">Watch Repository</div>
      <div style="display:flex;gap:10px;margin-bottom:8px">
        <input type="text" id="fv-git-watch-input" placeholder="~/development/my-repo" style="flex:1;min-width:0;background:#171b24;border:1px solid #353b4a;border-radius:4px;padding:8px 12px;font-size:13px;color:#e8ecf0;outline:none;font-family:-apple-system,sans-serif" />
        <button id="fv-git-watch-btn" style="width:70px;flex-shrink:0;background:#353b4a;border:none;border-radius:4px;padding:8px 0;font-size:12px;color:#ccd0d4;cursor:pointer;font-family:-apple-system,sans-serif">Watch</button>
      </div>
      <div id="fv-git-watch-status" style="font-size:11px;color:#6a7080;font-family:-apple-system,sans-serif;min-height:16px"></div>
    </div>
  </div>
</div>
<div class="fv-modal-overlay" id="fv-modal-overlay">
  <div class="fv-modal">
    <input class="fv-modal-input" id="fv-modal-input" type="text" placeholder="Search files..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />
    <div class="fv-modal-mode" id="fv-modal-mode"><span class="fv-modal-mode-text" id="fv-modal-mode-text">Files &middot; Ctrl+F for text search</span><span class="fv-modal-root" id="fv-modal-root" style="display:none" title="Click to change search root"></span></div>
    <ul class="fv-modal-list" id="fv-modal-list"></ul>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
<script src="js/constants.js"></script>
<script src="js/state.js"></script>
<script src="js/helpers.js"></script>
<script src="js/theme-engine.js"></script>
<script src="js/tab-bar.js"></script>
<script src="js/group-bar.js"></script>
<script src="js/content-swap.js"></script>
<script src="js/diff-viewer.js"></script>
<script src="js/search-modal.js"></script>
<script src="js/keyboard.js"></script>
<script src="js/app.js"></script>
</body>
</html>
